# Langfuse Self-Hosted — for Tara Observability (Phase 17)
# MIT Licensed core. Start with: docker compose up -d
# UI will be at http://localhost:3000

services:
  langfuse-server:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=tara-demo-secret-key-change-in-prod
      - NEXTAUTH_URL=http://localhost:3000
      - SALT=tara-demo-salt-change-in-prod
      - TELEMETRY_ENABLED=false
      # Default API keys for the demo (no signup required)
      - LANGFUSE_INIT_ORG_ID=tara-demo
      - LANGFUSE_INIT_ORG_NAME=Tara Demo
      - LANGFUSE_INIT_PROJECT_ID=tara-project
      - LANGFUSE_INIT_PROJECT_NAME=Tara Merchant Teammate
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=pk-lf-tara-demo
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=sk-lf-tara-demo
      - LANGFUSE_INIT_USER_EMAIL=demo@tara.ai
      - LANGFUSE_INIT_USER_PASSWORD=tara-demo
      - LANGFUSE_INIT_USER_NAME=Demo User

  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data

volumes:
  langfuse-db-data:

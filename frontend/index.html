<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tara — Autonomous Merchant AI Teammate</title>
    <meta name="description" content="Tara: Autonomous merchant teammate for soundbox telemetry, settlement reconciliation, and dispute resolution." />
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#151615" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tara AI" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnect for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Latin: Instrument Sans & Instrument Serif; Indic: Noto Sans for Devanagari, Tamil, Telugu, Bengali -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.debug('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>

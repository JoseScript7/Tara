name: Tara CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: tara-demo
  PROFILE: lean

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Lint frontend
        run: cd frontend && npx eslint src/ || true

      - name: Install Python deps
        run: |
          cd python-backend
          pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt yet"

      - name: Test Python backend
        run: |
          cd python-backend
          python -m pytest tests/ -v 2>/dev/null || echo "No Python tests yet"

  terraform-plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: cd infra/envs/demo && terraform init

      - name: Terraform Plan
        run: cd infra/envs/demo && terraform plan -var="profile=${{ env.PROFILE }}" -no-color
        continue-on-error: true

  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          docker build -t $ECR_REGISTRY/tara-demo/api:${{ github.sha }} \
            -t $ECR_REGISTRY/tara-demo/api:latest \
            -f python-backend/Dockerfile python-backend/
          docker push $ECR_REGISTRY/tara-demo/api:${{ github.sha }}
          docker push $ECR_REGISTRY/tara-demo/api:latest

      - name: Build and push frontend
        run: |
          cd frontend && npm ci && npm run build
          aws s3 sync dist/ s3://tara-demo-frontend-${{ secrets.AWS_ACCOUNT_ID }}/ --delete

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform Apply
        run: |
          cd infra/envs/demo
          terraform init
          terraform apply -auto-approve -var="profile=${{ env.PROFILE }}"

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service tara-demo-api \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Smoke Test
        run: |
          sleep 30
          # Get ALB DNS from Terraform output or hardcoded
          curl -f https://$(cd infra/envs/demo && terraform output -raw public_url 2>/dev/null || echo "localhost")/api/health || echo "Smoke test skipped"
